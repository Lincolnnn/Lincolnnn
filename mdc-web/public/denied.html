<!doctype html>
<html lang="fr">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dispatch — Accès refusé</title>
    <link rel="icon" href="/assets/shield.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/assets/app.css">
</head>
<body class="auth-page">
    <main class="auth-card denied">
        <img class="auth-logo" src="/assets/shield.svg" alt="">
        <h1>Accès refusé</h1>
        <p class="auth-text" id="deniedText">Votre compte Discord n'a pas le rôle « Dispatch » sur le serveur Discord.</p>
        <p class="auth-foot">Si vous pensez qu'il s'agit d'une erreur, demandez le rôle à un administrateur, puis reconnectez-vous.</p>
        <a class="btn-discord secondary" href="/login">Revenir à la connexion</a>
    </main>
    <script src="/assets/login.js"></script>
</body>
