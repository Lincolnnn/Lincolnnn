# =====================================================================================================================
# Serveur relais WebRTC du LiveView (LiveKit) — exemple à copier sur le serveur relais (ex. /etc/livekit/livekit.yaml)
# Remplacez live.exemple.fr / turn.exemple.fr et les clés. Ce fichier rempli ne doit JAMAIS être publié.
# Guide : ../docs/LIVEVIEW_WEBRTC.md
# =====================================================================================================================
port: 7880                      # API HTTP + signalisation (derrière le reverse proxy HTTPS -> wss://live.exemple.fr)
bind_addresses:
  - 127.0.0.1                   # API locale seulement : le reverse proxy la publie en HTTPS

rtc:
  tcp_port: 7881                # média en TCP (repli quand l'UDP est filtré)
  port_range_start: 50000       # média en UDP
  port_range_end: 60000
  use_external_ip: true         # annonce l'IP publique de la machine

turn:
  enabled: true
  domain: turn.exemple.fr       # nom DNS pointant vers ce serveur
  tls_port: 5349                # TURN/TLS : réseaux qui ne laissent passer que du « HTTPS »
  udp_port: 3478                # TURN/UDP (et STUN)
  # certificat pour turn.domain (ou un équilibreur TLS devant le port 5349) :
  cert_file: /etc/livekit/turn.crt
  key_file: /etc/livekit/turn.key

keys:
  # clé : secret (32 caractères au moins) — les mêmes que LIVEKIT_API_KEY / LIVEKIT_API_SECRET dans le .env du site
  APIremplacez_moi: remplacez_par_un_secret_long_et_aleatoire_de_32_caracteres_ou_plus

room:
  empty_timeout: 30             # salle vide fermée après 30 s (le site les ferme aussi lui-même)
  departure_timeout: 10
  max_participants: 12          # 1 joueur + dispatchers

logging:
  level: info
