<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Gestion du trafic</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="tc" class="tc hidden" role="dialog" aria-label="Gestion du trafic">
        <header class="tc-head">
            <div class="tc-title">
                <span class="tc-tag">TRAFIC</span>
                <div>
                    <div class="tc-name">Gestion du trafic</div>
                    <div class="tc-sub" id="tcSub"></div>
                </div>
            </div>
            <button class="tc-close" id="tcClose" title="Fermer (Échap)">✕</button>
        </header>

        <section class="tc-section">
            <div class="tc-legend">Nouvelle mesure</div>
            <div class="tc-kinds">
                <button class="tc-kind" data-kind="close">
                    <span class="tc-ico ico-close">
                        <svg viewBox="0 0 24 24"><rect x="2" y="8" width="20" height="6" rx="1.5"/><path d="M6 8l-3 6M11 8l-3 6M16 8l-3 6M21 8l-3 6" /><path d="M5 14v6M19 14v6"/></svg>
                    </span>
                    <span class="tc-kind-text"><b>Route barrée</b><small>Tronçon fermé : les PNJ prennent une déviation</small></span>
                </button>
                <button class="tc-kind" data-kind="speed">
                    <span class="tc-ico ico-speed"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><text x="12" y="15.5" id="tcSpeedIco">25</text></svg></span>
                    <span class="tc-kind-text"><b>Limitation de vitesse</b><small>Zone ronde : les PNJ ralentissent</small></span>
                </button>
                <button class="tc-kind" data-kind="stop">
                    <span class="tc-ico ico-stop"><svg viewBox="0 0 24 24"><path d="M8 2h8l6 6v8l-6 6H8l-6-6V8z"/><path d="M8 12h8"/></svg></span>
                    <span class="tc-kind-text"><b>Arrêt du trafic</b><small>Zone ronde : les véhicules s'arrêtent</small></span>
                </button>
            </div>
            <div class="tc-settings">
                <div class="tc-field">
                    <span class="tc-label">Vitesse (limitation)</span>
                    <div class="tc-qty">
                        <button class="tc-qty-btn" data-speed="-1" aria-label="Moins vite">−</button>
                        <span class="tc-qty-value" id="tcSpeed">25 MPH</span>
                        <button class="tc-qty-btn" data-speed="1" aria-label="Plus vite">+</button>
                    </div>
                </div>
                <div class="tc-field">
                    <span class="tc-label">Durée</span>
                    <div class="tc-chips" id="tcDurations"></div>
                </div>
            </div>
            <div class="tc-hint">Choisissez une mesure, puis posez-la en visant la route : <b>E</b> pour valider.</div>
        </section>

        <section class="tc-section">
            <div class="tc-legend">Mesures actives <span id="tcCount"></span></div>
            <div class="tc-list" id="tcList"></div>
            <div class="tc-row-actions">
                <button class="tc-btn" id="tcClearMine">Lever mes mesures</button>
                <button class="tc-btn tc-danger" id="tcClearAll">Tout lever</button>
            </div>
        </section>

        <div class="tc-message" id="tcMessage"></div>
        <div class="tc-foot">Commande <b>/trafic</b> · Échap pour fermer</div>
    </div>
    <script src="script.js"></script>
</body>
</html>
