<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>html, body { background: transparent !important; }</style>
    <link rel="stylesheet" href="style.css">
    <title>TASER 10 CID</title>
</head>
<body>
    <main id="cid" class="cid hidden">
        <div id="axonDisplay" class="axon-display">
            <div id="screenDisplay" class="screen-display"></div>
            <div id="batteryDisplay" class="battery-display hidden"></div>
        </div>
    </main>
    <script src="app.js"></script>
    <script>/* rp_freecam (mode photo) : interface masquée tant que « Masquer les interfaces » est coché */
        window.addEventListener('message', (e) => { const d = e.data; if (d && d.action === 'rpHideUi') document.documentElement.style.opacity = d.data && d.data.hidden ? '0' : ''; });</script>
</body>
</html>
