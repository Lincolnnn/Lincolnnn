<!DOCTYPE html>
<html lang="fr" data-theme="night" data-night-color="logo">
<head>
    <meta charset="UTF-8">
    <title>Équipement</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="equip" class="equip hidden" role="dialog" aria-label="Équipement du véhicule">
        <header class="eq-head">
            <div class="eq-title">
                <span class="eq-tag" id="eqTag">WSP</span>
                <div>
                    <div class="eq-name">Équipement</div>
                    <div class="eq-sub" id="eqSub">Coffre</div>
                </div>
            </div>
            <button class="eq-close" id="eqClose" title="Fermer (Échap)">✕</button>
        </header>

        <!-- Onglets ouvrables / refermables (comme Customiser équipement) ; Arme longue ouvert par défaut.
             Coffre : Arme longue, Équipement (s'il y en a), puis « Affaires » (titre) : Matériel, Jerrycan.
             Avant : Arme longue, Équipement (s'il y en a), Fusées de détresse. -->
        <section class="eq-fold" data-fold="rack" id="eqRackSection">
            <button class="eq-fold-head" type="button"><span class="eq-fold-mark"></span><span class="eq-fold-title" id="eqRackLegend">Arme longue</span><span class="eq-fold-sum" id="eqRackSum"></span></button>
            <div class="eq-fold-body">
                <div class="eq-slots" id="eqSlots"></div>
                <button class="eq-btn eq-primary eq-store" id="eqStore">Ranger l'arme longue</button>
                <div class="eq-hint" id="eqHeld"></div>
            </div>
        </section>

        <section class="eq-fold" data-fold="assets" id="eqAssetsSection">
            <button class="eq-fold-head" type="button"><span class="eq-fold-mark"></span><span class="eq-fold-title">Équipement</span><span class="eq-fold-sum" id="eqAssetsSum"></span></button>
            <div class="eq-fold-body"><div class="eq-items" id="eqItems"></div></div>
        </section>

        <!-- Avant : fusées de détresse (FrontMax) -->
        <section class="eq-fold hidden" data-fold="frontFlares" id="eqFrontFlaresSection">
            <button class="eq-fold-head" type="button"><span class="eq-fold-mark"></span><span class="eq-fold-title">Fusées de détresse</span><span class="eq-fold-sum" id="eqFrontFlaresSum"></span></button>
            <div class="eq-fold-body">
                <div class="eq-stock-row">
                    <div class="eq-stock-info">
                        <div class="eq-stock-count" id="eqFrontFlares"></div>
                        <div class="eq-stock-held" data-flares-held></div>
                    </div>
                    <div class="eq-stock-actions eq-stock-grid">
                        <button class="eq-btn eq-primary" data-flares="take">Prendre 1</button>
                        <button class="eq-btn" data-flares="take" data-all="1">Prendre tout</button>
                        <button class="eq-btn" data-flares="store">Ranger 1</button>
                        <button class="eq-btn" data-flares="store" data-all="1">Tout ranger</button>
                    </div>
                </div>
            </div>
        </section>

        <!-- Coffre comme un inventaire : ce qui est pris n'y est plus, ce qui est rangé y revient -->
        <div class="eq-group hidden" id="eqStockSection">
            <div class="eq-group-title">Affaires</div>
            <section class="eq-fold" data-fold="gear">
                <button class="eq-fold-head" type="button"><span class="eq-fold-mark"></span><span class="eq-fold-title">Matériel</span><span class="eq-fold-sum" id="eqGearSum"></span></button>
                <div class="eq-fold-body">
                    <div class="eq-stock">
                        <div class="eq-stock-row">
                            <div class="eq-stock-info">
                                <div class="eq-stock-name">Plots de circulation</div>
                                <div class="eq-stock-count" id="eqCones"></div>
                                <div class="eq-stock-bar"><span id="eqConesBar"></span></div>
                            </div>
                            <div class="eq-stock-actions">
                                <div class="eq-qty" title="Nombre de plots à prendre">
                                    <button class="eq-qty-btn" data-qty="-1" aria-label="Un de moins">−</button>
                                    <span class="eq-qty-value" id="eqConeQty">1</span>
                                    <button class="eq-qty-btn" data-qty="1" aria-label="Un de plus">+</button>
                                </div>
                                <button class="eq-btn eq-primary" id="eqConeTake">Prendre 1 plot</button>
                                <button class="eq-btn" id="eqConeStore">Ranger le plot</button>
                            </div>
                        </div>
                        <div class="eq-stock-row">
                            <div class="eq-stock-info">
                                <div class="eq-stock-name">Fusées de détresse</div>
                                <div class="eq-stock-count" id="eqFlares"></div>
                                <div class="eq-stock-held" data-flares-held></div>
                            </div>
                            <div class="eq-stock-actions eq-stock-grid">
                                <button class="eq-btn eq-primary" data-flares="take">Prendre 1</button>
                                <button class="eq-btn" data-flares="take" data-all="1">Prendre tout</button>
                                <button class="eq-btn" data-flares="store">Ranger 1</button>
                                <button class="eq-btn" data-flares="store" data-all="1">Tout ranger</button>
                            </div>
                        </div>
                        <div class="eq-stock-row">
                            <div class="eq-stock-info">
                                <div class="eq-stock-name">Pistolet radar</div>
                                <div class="eq-stock-count" id="eqRadars"></div>
                                <div class="eq-stock-held" id="eqRadarHeld"></div>
                            </div>
                            <div class="eq-stock-actions">
                                <button class="eq-btn eq-primary" id="eqRadarTake">Prendre</button>
                                <button class="eq-btn" id="eqRadarStore">Ranger</button>
                            </div>
                        </div>
                        <!-- Herse (riven_spikes) : prise et rangée ici uniquement -->
                        <div class="eq-stock-row hidden" id="eqSpikeRow">
                            <div class="eq-stock-info">
                                <div class="eq-stock-name">Herse</div>
                                <div class="eq-stock-count">Une dans le coffre de chaque véhicule de police</div>
                                <div class="eq-stock-held" id="eqSpikeHeld"></div>
                            </div>
                            <div class="eq-stock-actions">
                                <button class="eq-btn eq-primary" id="eqSpikeTake">Prendre</button>
                                <button class="eq-btn" id="eqSpikeStore">Ranger</button>
                            </div>
                        </div>
                    </div>
                    <div class="eq-hint" id="eqCarry"></div>
                </div>
            </section>
            <section class="eq-fold" data-fold="cans">
                <button class="eq-fold-head" type="button"><span class="eq-fold-mark"></span><span class="eq-fold-title">Jerrycan</span><span class="eq-fold-sum" id="eqCansSum"></span></button>
                <div class="eq-fold-body">
                    <div class="eq-stock-row">
                        <div class="eq-stock-info">
                            <div class="eq-stock-name">Jerrican d'essence</div>
                            <div class="eq-stock-count" id="eqCans"></div>
                            <div class="eq-stock-held" id="eqCanHeld"></div>
                        </div>
                        <div class="eq-stock-actions">
                            <button class="eq-btn eq-primary" id="eqCanTake">Prendre</button>
                            <button class="eq-btn" id="eqCanStore">Ranger</button>
                        </div>
                    </div>
                </div>
            </section>
        </div>

        <div class="eq-message" id="eqMessage"></div>
        <footer class="eq-foot" id="eqFoot"></footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
