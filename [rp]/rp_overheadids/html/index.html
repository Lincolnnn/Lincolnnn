<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Noms au-dessus des têtes</title>
<style>
    /* Même allure que les menus du serveur (thème jour : sombre et rouge ; nuit : noir et couleur du mode nuit) */
    :root {
        --surface: #141518; --line: rgba(255, 255, 255, .08); --text: #eef1f5; --muted: rgba(238, 241, 245, .62);
        --accent: #a51d2a; --banner-1: #8a1824; --banner-2: #3b0d13; --radius: 5px;
        --font: "Segoe UI Variable Text", "Segoe UI", "Inter", system-ui, Arial, sans-serif;
    }
    :root[data-theme="night"] { --surface: #050606; --banner-1: #101312; --banner-2: #050606; }
    :root[data-theme="night"][data-night-color="green"] { --accent: #2f9e57; }
    :root[data-theme="night"][data-night-color="yellow"] { --accent: #b8901f; }
    :root[data-theme="night"][data-night-color="red"] { --accent: #b3342a; }
    :root[data-theme="night"][data-night-color="blue"] { --accent: #2f6fb8; }
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font-family: var(--font); user-select: none; }
    .hidden { display: none !important; }
    .box {
        position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 380px;
        background: var(--surface); color: var(--text); border: 1px solid var(--line); border-radius: var(--radius);
        box-shadow: 0 18px 40px rgba(0, 0, 0, .45); overflow: hidden;
    }
    .banner { padding: 14px 16px 12px; background: linear-gradient(135deg, var(--banner-1), var(--banner-2)); }
    .title { font-size: 18px; font-weight: 700; }
    .sub { margin-top: 2px; font-size: 12px; color: rgba(255, 255, 255, .78); }
    .opts { padding: 6px; }
    .opt {
        display: flex; flex-direction: column; gap: 2px; width: 100%; margin: 2px 0; padding: 10px 12px; text-align: left;
        font: inherit; color: var(--text); background: transparent; border: 0; border-radius: 3px; cursor: pointer;
    }
    .opt b { font-size: 14px; }
    .opt span { font-size: 12px; color: var(--muted); }
    .opt:hover { background: rgba(255, 255, 255, .06); }
    .opt.sel { background: var(--accent); }
    .opt.sel span { color: rgba(255, 255, 255, .85); }
    .opt.current b::after { content: "  ✓"; }
    .keys { display: flex; gap: 12px; padding: 8px 14px 10px; font-size: 11px; color: var(--muted); border-top: 1px solid var(--line); }
    kbd { padding: 0 5px; border: 1px solid var(--line); border-radius: 3px; font: inherit; color: var(--text); }
</style>
</head>
<body>
<div class="box hidden" id="box" role="dialog" aria-label="Noms au-dessus des têtes">
    <div class="banner"><div class="title">Noms au-dessus des têtes</div><div class="sub" id="sub"></div></div>
    <div class="opts" id="opts">
        <button class="opt" data-mode="hold"><b>Maintenir touche</b><span>Les noms s'affichent tant que la touche est maintenue.</span></button>
        <button class="opt" data-mode="toggle"><b>Appuyer pour activer</b><span>Un appui affiche les noms, un autre appui les retire.</span></button>
    </div>
    <div class="keys"><span><kbd>↑</kbd><kbd>↓</kbd> Choisir</span><span><kbd>Entrée</kbd> Valider</span><span><kbd>Échap</kbd> Fermer</span></div>
</div>
<script>
(() => {
    const RESOURCE = typeof GetParentResourceName === 'function' ? GetParentResourceName() : 'rp_overheadids';
    const post = (name, data = {}) => fetch(`https://${RESOURCE}/${name}`, { method: 'POST', body: JSON.stringify(data) }).catch(() => {});
    const box = document.getElementById('box');
    const opts = [...document.querySelectorAll('.opt')];
    let sel = 0, open = false;
    const render = (current) => opts.forEach((o, i) => {
        o.classList.toggle('sel', i === sel);
        if (current) o.classList.toggle('current', o.dataset.mode === current);
    });
    const choose = (mode) => { open = false; box.classList.add('hidden'); post('setMode', { mode }); };
    const close = () => { open = false; box.classList.add('hidden'); post('close'); };
    opts.forEach((o, i) => {
        o.addEventListener('mouseenter', () => { sel = i; render(); });
        o.addEventListener('click', () => choose(o.dataset.mode));
    });
    window.addEventListener('keydown', (e) => {
        if (!open) return;
        if (e.key === 'ArrowUp' || e.key === 'ArrowDown') { sel = (sel + 1) % opts.length; render(); e.preventDefault(); }
        else if (e.key === 'Enter') choose(opts[sel].dataset.mode);
        else if (e.key === 'Escape' || e.key === 'Backspace') close();
    });
    window.addEventListener('message', (e) => {
        const m = e.data || {};
        if (m.action === 'open') {
            open = true;
            sel = Math.max(0, opts.findIndex((o) => o.dataset.mode === m.mode));
            document.getElementById('sub').textContent = `Touche : ${m.key || 'Début'} · /${m.command || 'configtetes'}`;
            render(m.mode);
            box.classList.remove('hidden');
        } else if (m.action === 'uiTheme') {
            document.documentElement.dataset.theme = m.theme === 'night' ? 'night' : 'day';
            document.documentElement.dataset.nightColor = m.color || 'green';
        }
    });
})();
</script>
</body>
</html>
