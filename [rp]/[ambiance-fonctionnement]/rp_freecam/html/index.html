<!DOCTYPE html>
<html lang="fr" data-theme="day" data-night-color="green">
<head>
    <meta charset="UTF-8">
    <title>RP Freecam</title>
    <style>
        /* Couleurs du serveur : de jour, celles du logo (noir et rouge) ; mode nuit du MDC : sa couleur */
        :root {
            --card: 12, 12, 14; --accent: #d8323f; --accent-rgb: 216, 50, 63; --banner: #8a121b;
            --text: #ececec; --muted: rgba(236, 236, 236, .6);
        }
        [data-theme="night"][data-night-color="green"] { --card: 1, 6, 3; --accent: #27a854; --accent-rgb: 39, 168, 84; --banner: #0f4a25; --text: #6cc28b; --muted: rgba(108, 194, 139, .65); }
        [data-theme="night"][data-night-color="yellow"] { --card: 6, 5, 1; --accent: #a89027; --accent-rgb: 168, 144, 39; --banner: #4a3f0f; --text: #c2b36c; --muted: rgba(194, 179, 108, .65); }
        [data-theme="night"][data-night-color="red"] { --card: 6, 1, 1; --accent: #c12d2f; --accent-rgb: 193, 45, 47; --banner: #4a0f10; --text: #cb8282; --muted: rgba(203, 130, 130, .65); }
        [data-theme="night"][data-night-color="blue"] { --card: 1, 3, 6; --accent: #3077cd; --accent-rgb: 48, 119, 205; --banner: #0f2a4a; --text: #8caacf; --muted: rgba(140, 170, 207, .65); }

        html, body { margin: 0; background: transparent; overflow: hidden; }
        #menu {
            position: fixed; top: 2.2vh; left: 1.2vw; width: 320px; overflow: hidden; pointer-events: none; user-select: none;
            background: rgba(var(--card), .94); border: 1px solid rgba(255, 255, 255, .08); border-radius: 4px;
            box-shadow: 0 14px 30px rgba(0, 0, 0, .5), 0 2px 8px rgba(0, 0, 0, .4);
            font: 14px/1.3 'Segoe UI', Roboto, Arial, sans-serif; color: var(--text);
            opacity: 0; transform: translateX(-8px); transition: opacity .15s, transform .15s;
        }
        #menu.show { opacity: 1; transform: none; }
        .head {
            padding: 12px 14px 10px; color: #fff; background-color: var(--banner);
            background-image: radial-gradient(120% 140% at 0% 0%, rgba(255, 255, 255, .16), transparent 55%),
                linear-gradient(125deg, rgba(255, 255, 255, .07) 0%, rgba(255, 255, 255, 0) 45%, rgba(10, 10, 12, .5) 100%);
            border-bottom: 1px solid rgba(255, 255, 255, .12);
        }
        .head .title { font-size: 17px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
        .head .sub { font-size: 12px; opacity: .8; margin-top: 2px; }
        ul { list-style: none; margin: 0; padding: 5px 0; }
        li { display: flex; align-items: center; gap: 10px; padding: 8px 14px; position: relative; }
        li.sel { background: rgba(var(--accent-rgb), .2); box-shadow: inset 3px 0 0 var(--accent); font-weight: 600; }
        li.disabled { color: var(--muted); }
        li .label { flex: 1; }
        li .value { color: var(--muted); font-size: 13px; }
        li.sel .value { color: var(--text); }
        li .arrows::before { content: '‹ '; } li .arrows::after { content: ' ›'; }
        .check { width: 16px; height: 16px; border-radius: 3px; border: 1.5px solid var(--muted); display: grid; place-items: center; }
        .check.on { background: var(--accent); border-color: var(--accent); }
        .check.on::after { content: ''; width: 8px; height: 4px; border: 2px solid #fff; border-top: 0; border-right: 0; transform: translateY(-1px) rotate(-45deg); }
        .desc { padding: 8px 14px 10px; font-size: 12px; color: var(--muted); border-top: 1px solid rgba(255, 255, 255, .06); }
        .keys { display: flex; flex-wrap: wrap; gap: 4px 10px; }
        kbd {
            display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 5px; color: #fff;
            background: rgba(var(--accent-rgb), .28); border: 1px solid rgba(var(--accent-rgb), .55); border-radius: 3px;
            font: 700 11px 'Segoe UI', Roboto, Arial, sans-serif; margin-right: 3px;
        }
    </style>
</head>
<body>
    <div id="menu" aria-hidden="true">
        <div class="head"><div class="title">Mode photo</div><div class="sub" id="sub">Caméra libre</div></div>
        <ul id="items"></ul>
        <div class="desc" id="desc"></div>
    </div>
    <script>
        (() => {
            const menu = document.getElementById('menu');
            const list = document.getElementById('items');
            const desc = document.getElementById('desc');
            const esc = (t) => String(t == null ? '' : t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
            const KEYS_MENU = '<div class="keys"><span><kbd>↑</kbd><kbd>↓</kbd>choisir</span><span><kbd>←</kbd><kbd>→</kbd>régler</span>'
                + '<span><kbd>Entrée</kbd>activer</span><span><kbd>H</kbd>masquer le menu</span><span><kbd>Retour</kbd>quitter</span></div>';
            const KEYS_PHOTO = '<div class="keys" style="margin-top:6px"><span><kbd>Espace</kbd>masquer / remettre le menu (photo)</span></div>';
            const KEYS_CAM = '<div class="keys" style="margin-top:6px"><span><kbd>Z</kbd><kbd>Q</kbd><kbd>S</kbd><kbd>D</kbd>bouger</span>'
                + '<span><kbd>E</kbd><kbd>A</kbd>monter / descendre</span><span><kbd>Maj</kbd>vite</span><span><kbd>Ctrl</kbd>lent</span>'
                + '<span><kbd>Molette</kbd>zoom</span></div>';
            function render(d) {
                menu.classList.toggle('show', d.open === true);
                if (!d.open) return;
                const items = Array.isArray(d.items) ? d.items : Object.values(d.items || {});
                const sel = Number(d.index) || 1;
                list.innerHTML = items.map((it, i) => {
                    const right = it.kind === 'check' ? `<span class="check ${it.value ? 'on' : ''}"></span>`
                        : it.kind === 'list' ? `<span class="value arrows">${esc(it.value)}</span>` : '';
                    return `<li class="${i + 1 === sel ? 'sel' : ''} ${it.disabled ? 'disabled' : ''}"><span class="label">${esc(it.label)}</span>${right}</li>`;
                }).join('');
                const current = items[sel - 1];
                document.getElementById('sub').textContent = d.freecam ? 'Caméra libre : activée' : 'Caméra libre : désactivée';
                desc.innerHTML = (current && current.desc ? `<div style="margin-bottom:6px">${esc(current.desc)}</div>` : '') + KEYS_MENU + (d.freecam ? KEYS_CAM + KEYS_PHOTO : '');
            }
            window.addEventListener('message', ({ data }) => {
                if (!data || !data.action) return;
                const d = data.data || {};
                if (data.action === 'uiTheme') {
                    document.documentElement.dataset.theme = d.theme === 'night' ? 'night' : 'day';
                    document.documentElement.dataset.nightColor = ['green', 'yellow', 'red', 'blue'].includes(d.color) ? d.color : 'green';
                } else if (data.action === 'menu') render(d);
            });
        })();
    </script>
</body>
</html>
