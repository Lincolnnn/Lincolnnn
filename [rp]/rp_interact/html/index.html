<!DOCTYPE html>
<html lang="fr" data-theme="night" data-night-color="logo">
<head>
    <meta charset="UTF-8">
    <title>RP Interact</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- ================= ŒIL (Eye Target) ================= -->
    <div class="eye hidden" id="eye">
        <svg class="eye-icon" viewBox="0 0 64 40" aria-hidden="true">
            <path d="M2 20 C14 4 50 4 62 20 C50 36 14 36 2 20 Z" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linejoin="round"/>
            <circle cx="32" cy="20" r="8.5" fill="currentColor"/>
        </svg>
        <div class="eye-label hidden" id="eyeLabel"></div>
        <ul class="eye-options hidden" id="eyeOptions"></ul>
    </div>

    <!-- ================= MENU INTERACTION : au clavier (comme le /eup), rempli par script.js (KbMenu) ================= -->
    <div class="kbmenu menu hidden" id="menu" aria-hidden="true"></div>

    <!-- ================= FICHE CIVILE (style MDC, hors MDC) ================= -->
    <div class="window hidden" id="editor">
        <div class="titlebar" id="editorBar">
            <div class="title"><span class="title-icon">CIVIL</span><span>Fiche civile</span></div>
            <div class="win-buttons">
                <button type="button" class="win-btn win-close" id="editorClose" title="Fermer (Échap)">&#10005;</button>
            </div>
        </div>
        <nav class="tabbar">
            <button type="button" class="tab active" data-tab="profiles">Profils</button>
            <button type="button" class="tab" data-tab="vehicle">Véhicule</button>
        </nav>
        <main class="content">
            <!-- Profils : liste (permanents, uniquement les siens) + détail / formulaire -->
            <section class="page" data-page="profiles">
                <div class="split">
                    <div class="group">
                        <span class="legend">Mes profils <span id="profileCount"></span></span>
                        <div class="toolbar">
                            <button type="button" class="btn btn-default" id="newProfile">+ Nouveau profil</button>
                        </div>
                        <div class="well">
                            <table class="grid selectable">
                                <thead><tr><th>Nom du profil</th><th>État</th><th>Modifié</th></tr></thead>
                                <tbody id="profileBody"></tbody>
                            </table>
                            <div class="empty" id="profileEmpty">Aucun profil : créez-en un.</div>
                        </div>
                    </div>
                    <div class="group">
                        <span class="legend" id="profilePanelTitle">Profil</span>
                        <div class="well detail" id="profileDetail"></div>
                    </div>
                </div>
            </section>

            <!-- Véhicule : profil temporaire lié au véhicule physique -->
            <section class="page hidden" data-page="vehicle">
                <div class="group fill">
                    <span class="legend" id="vehicleTitle">Véhicule</span>
                    <div class="well detail" id="vehicleDetail"></div>
                </div>
            </section>
        </main>
        <div class="statusbar">
            <span class="sb-cell grow" id="editorStatus"></span>
        </div>
    </div>

    <!-- Barre de chargement (fouilles, menottes) : thème du HUD, barre bleue -->
    <!-- Se débattre (civil tenu par le bras sans menottes) / l'individu se débat (policier) -->
    <div class="struggle hidden" id="struggle">
        <div class="struggle-head">
            <span id="struggleLabel">Se débattre</span>
            <span class="struggle-key" id="struggleHint"><kbd id="struggleKey">ESPACE</kbd> plusieurs fois</span>
        </div>
        <div class="progress-track"><div class="struggle-bar" id="struggleBar"></div></div>
    </div>

    <div class="progress hidden" id="progress">
        <div class="progress-head"><span id="progressLabel"></span><span class="progress-time" id="progressTime"></span></div>
        <div class="progress-track"><div class="progress-bar" id="progressBar"></div></div>
        <div class="progress-hint"><kbd>X</kbd> Annuler</div>
    </div>

    <!-- Tips d'arrestation (mode civil) : en haut au milieu, non interactif -->
    <div class="tips hidden" id="tips">
        <div class="tips-title" id="tipsTitle">Tips arrestation</div>
        <div class="tips-keys" id="tipsKeys"></div>
        <div class="tips-close">Échap : fermer</div>
    </div>

    <!-- Odeur détectée (policier en service, à moins de 6 m) : en haut au milieu, comme une zone de recherche -->
    <div class="smell hidden" id="smell" aria-live="polite">
        <div class="smell-head"><span class="smell-dot"></span>ODEUR DÉTECTÉE<span class="smell-label" id="smellLabel"></span></div>
        <div class="smell-text" id="smellText"></div>
    </div>

    <!-- Menu des tenues /eup : au clavier (flèches, Entrée, Retour arrière), même menu que le Menu Interaction -->
    <div class="kbmenu eup hidden" id="eup" aria-hidden="true"></div>

    <!-- Lecteurs de la radio des véhicules (invisibles) -->
    <div class="radio-players" id="radioPlayers" aria-hidden="true"></div>

    <!-- Résultats d'inspection (à droite) et notifications (en haut) -->
    <div class="results" id="results"></div>
    <div class="toasts" id="toasts"></div>

    <script src="script.js"></script>
</body>
</html>
