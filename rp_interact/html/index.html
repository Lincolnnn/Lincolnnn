<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>RP Interact</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- ================= ŒIL (Eye Target) ================= -->
    <div class="eye hidden" id="eye">
        <svg class="eye-icon" viewBox="0 0 64 40" aria-hidden="true">
            <path d="M2 20 C14 4 50 4 62 20 C50 36 14 36 2 20 Z" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linejoin="round"/>
            <circle cx="32" cy="20" r="8.5" fill="currentColor"/>
        </svg>
        <div class="eye-label hidden" id="eyeLabel"></div>
        <ul class="eye-options hidden" id="eyeOptions"></ul>
    </div>

    <!-- ================= MENU D'INTERACTIONS ================= -->
    <div class="panel menu hidden" id="menu">
        <div class="menu-head">
            <button type="button" class="menu-back hidden" id="menuBack" title="Retour">&#8249;</button>
            <span class="menu-title" id="menuTitle">Interactions</span>
            <button type="button" class="menu-close" id="menuClose" title="Fermer (Échap)">&#10005;</button>
        </div>

        <div class="menu-view" data-view="home">
            <button type="button" class="menu-case" data-go="police">
                <span class="case-icon">
                    <svg viewBox="0 0 24 24"><path d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5l-8-3Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
                </span>
                <span class="case-text"><b>Police</b><small id="menuPoliceHint">Hors service</small></span>
                <span class="case-arrow">&#8250;</span>
            </button>
            <button type="button" class="menu-case" data-go="civil">
                <span class="case-icon">
                    <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
                </span>
                <span class="case-text"><b>Civil</b><small id="menuCivilHint">Profils et véhicule</small></span>
                <span class="case-arrow">&#8250;</span>
            </button>
        </div>

        <div class="menu-view hidden" data-view="civil">
            <div class="menu-active" id="menuActive"></div>
            <label class="menu-toggle">
                <input type="checkbox" id="civilMode">
                <span class="toggle-box"></span>
                <span class="toggle-text"><b>Mode civil</b><small>Options visuelles propres au rôle de civil (tips d'arrestation)</small></span>
            </label>
            <button type="button" class="menu-btn" data-editor="profiles">Créer un profil</button>
            <button type="button" class="menu-btn" data-editor="vehicle">Créer un véhicule</button>
            <button type="button" class="menu-btn menu-btn-tips hidden" id="tipsToggle">Tips arrestation</button>
        </div>

        <div class="menu-view hidden" data-view="police">
            <div class="menu-active" id="menuPolice"></div>
            <!-- Toujours affichées ; grisées tant que personne n'est assez proche (2 m) -->
            <button type="button" class="menu-btn police-action" data-police-action="cuff" disabled>Menotter</button>
            <button type="button" class="menu-btn police-action" data-police-action="drag" disabled>Prendre par le bras</button>
            <button type="button" class="menu-btn police-action" data-police-action="place" disabled>Placer l'individu à l'arrière du véhicule</button>
            <button type="button" class="menu-btn police-action" data-police-action="seat" disabled>Faire s'asseoir l'individu</button>
            <p class="menu-text" id="menuPoliceText"></p>
            <!-- Secteur (zone de jeu) et service principal : affichés sur le display MDC -->
            <div class="menu-profile">
                <div class="menu-profile-title">Display MDC</div>
                <label class="menu-field">Secteur
                    <input type="text" id="policeSector" maxlength="40" placeholder="ex : Downtown, I-75 Nord…">
                </label>
                <label class="menu-field">Service principal
                    <select id="policeService">
                        <option value="">— Aucun —</option>
                        <option value="apd">APD</option>
                        <option value="gsp">GSP</option>
                        <option value="both">APD &amp; GSP</option>
                    </select>
                </label>
            </div>
        </div>
    </div>

    <!-- ================= FICHE CIVILE (style MDC, hors MDC) ================= -->
    <div class="window hidden" id="editor">
        <div class="titlebar" id="editorBar">
            <div class="title"><span class="title-icon">CIVIL</span><span>Fiche civile</span></div>
            <div class="win-buttons">
                <button type="button" class="win-btn win-close" id="editorClose" title="Fermer (Échap)">&#10005;</button>
            </div>
        </div>
        <nav class="tabbar">
            <button type="button" class="tab active" data-tab="profiles">Profils</button>
            <button type="button" class="tab" data-tab="vehicle">Véhicule</button>
        </nav>
        <main class="content">
            <!-- Profils : liste (permanents, uniquement les siens) + détail / formulaire -->
            <section class="page" data-page="profiles">
                <div class="split">
                    <div class="group">
                        <span class="legend">Mes profils <span id="profileCount"></span></span>
                        <div class="toolbar">
                            <button type="button" class="btn btn-default" id="newProfile">+ Nouveau profil</button>
                        </div>
                        <div class="well">
                            <table class="grid selectable">
                                <thead><tr><th>Nom du profil</th><th>État</th><th>Modifié</th></tr></thead>
                                <tbody id="profileBody"></tbody>
                            </table>
                            <div class="empty" id="profileEmpty">Aucun profil : créez-en un.</div>
                        </div>
                    </div>
                    <div class="group">
                        <span class="legend" id="profilePanelTitle">Profil</span>
                        <div class="well detail" id="profileDetail"></div>
                    </div>
                </div>
            </section>

            <!-- Véhicule : profil temporaire lié au véhicule physique -->
            <section class="page hidden" data-page="vehicle">
                <div class="group fill">
                    <span class="legend" id="vehicleTitle">Véhicule</span>
                    <div class="well detail" id="vehicleDetail"></div>
                </div>
            </section>
        </main>
        <div class="statusbar">
            <span class="sb-cell grow" id="editorStatus"></span>
        </div>
    </div>

    <!-- Barre de chargement (fouilles, menottes) : thème du HUD, barre bleue -->
    <div class="progress hidden" id="progress">
        <div class="progress-head"><span id="progressLabel"></span><span class="progress-time" id="progressTime"></span></div>
        <div class="progress-track"><div class="progress-bar" id="progressBar"></div></div>
        <div class="progress-hint"><kbd>X</kbd> Annuler</div>
    </div>

    <!-- Tips d'arrestation (mode civil) : en haut au milieu, non interactif -->
    <div class="tips hidden" id="tips">
        <div class="tips-title" id="tipsTitle">Tips arrestation</div>
        <div class="tips-keys" id="tipsKeys"></div>
        <div class="tips-close">Échap : fermer</div>
    </div>

    <!-- Résultats d'inspection (à droite) et notifications (en haut) -->
    <div class="results" id="results"></div>
    <div class="toasts" id="toasts"></div>

    <script src="script.js"></script>
</body>
</html>
